<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>IT Company</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d1117;
    color:white;
}

header{
    text-align:center;
    padding:40px;
    font-size:35px;
}

.box{
    margin:15px auto;
    width:300px;
    padding:15px;
    border:1px solid #00ffff;
    text-align:center;
    transition:0.3s;
}

.box:hover{
    box-shadow:0 0 20px #00ffff;
}
</style>
</head>
<body>

<header>Tech Company</header>

<div class="box">Web Development</div>
<div class="box">AI Solutions</div>
<div class="box">Cloud Services</div>

</body>
</html>
